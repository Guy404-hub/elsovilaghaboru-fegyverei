
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0804;color:#e8dcc8;font-family:Georgia,serif;overflow-x:hidden}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{width:0}to{width:var(--w)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(180,140,60,0)}50%{box-shadow:0 0 16px 4px rgba(180,140,60,0.25)}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes smokeRise{0%{transform:translateY(0) scale(1);opacity:0.5}100%{transform:translateY(-40px) scale(1.6);opacity:0}}
@keyframes shellFly{0%{transform:translateX(-120px) rotate(-15deg);opacity:0}40%{opacity:1}100%{transform:translateX(120px) rotate(15deg);opacity:0}}
@keyframes explode{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}
@keyframes countUp{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
@keyframes barGrow{from{width:0}to{width:var(--target)}}
@keyframes dotPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.4)}}
@keyframes cardSlideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes quizPop{0%{transform:scale(0.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes correctFlash{0%,100%{background:rgba(74,124,63,0.1)}50%{background:rgba(74,124,63,0.25)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes smokePuff{0%{transform:translateY(0) scale(0.5);opacity:0}20%{opacity:0.6}100%{transform:translateY(-60px) scale(2);opacity:0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blinkLine{0%,100%{opacity:1}50%{opacity:0.3}}

.hero{text-align:center;padding:52px 24px 36px;background:#0a0804;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.smoke-particle{position:absolute;border-radius:50%;background:rgba(180,150,80,0.07);animation:smokePuff linear infinite}
.hero-year{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:180px;font-weight:900;color:rgba(180,140,60,0.04);white-space:nowrap;font-family:Georgia,serif;pointer-events:none;animation:fadeIn 2s ease both}
.eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#b8933a;margin-bottom:14px;animation:fadeUp 0.7s ease 0.2s both}
.hero h1{font-size:clamp(26px,5vw,58px);font-weight:900;color:#f0e6cc;line-height:1.1;margin-bottom:10px;animation:fadeUp 0.7s ease 0.4s both}
.hero-sub{color:rgba(200,180,150,0.55);font-size:14px;animation:fadeUp 0.7s ease 0.6s both}

.tabs{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;padding:0 12px 28px;animation:fadeUp 0.7s ease 0.8s both}
.tab{padding:8px 18px;border:1px solid rgba(180,140,60,0.18);background:transparent;color:rgba(200,180,150,0.5);cursor:pointer;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;transition:all 0.25s;border-radius:2px;position:relative;overflow:hidden}
.tab::after{content:'';position:absolute;bottom:0;left:0;height:2px;width:0;background:#b8933a;transition:width 0.3s}
.tab:hover{color:#e8dcc8;border-color:rgba(180,140,60,0.4)}
.tab.active{background:rgba(180,140,60,0.1);border-color:#b8933a;color:#f0e6cc;animation:pulseGold 2s ease infinite}
.tab.active::after{width:100%}

.panel{display:none}.panel.active{display:block}

.section{max-width:940px;margin:0 auto;padding:16px 18px 44px}

.w-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px}
@media(max-width:500px){.w-grid{grid-template-columns:repeat(2,1fr)}}
.w-btn{background:#0f0d08;border:1px solid rgba(180,140,60,0.1);padding:14px 8px;cursor:pointer;text-align:center;transition:border-color 0.2s,background 0.2s,transform 0.15s;color:#e8dcc8;font-family:Georgia,serif;position:relative;overflow:hidden}
.w-btn:hover{border-color:rgba(180,140,60,0.35);background:#14110a;transform:translateY(-2px)}
.w-btn.active{border-color:#b8933a;background:rgba(180,140,60,0.09);transform:translateY(-2px)}
.w-btn-ripple{position:absolute;border-radius:50%;background:rgba(180,140,60,0.15);animation:explode 0.5s ease forwards;pointer-events:none}
.w-icon{font-size:26px;display:block;margin-bottom:5px;transition:transform 0.3s}
.w-btn:hover .w-icon,.w-btn.active .w-icon{transform:scale(1.15) rotate(-5deg)}
.w-name{font-size:10px;letter-spacing:1px;color:rgba(200,180,150,0.65)}

.wd{background:#0f0d08;border:1px solid rgba(180,140,60,0.14);padding:24px 24px 20px;animation:cardSlideIn 0.35s ease}
.wd-top{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.wd-ico{font-size:52px;flex-shrink:0;animation:fadeIn 0.4s ease}
.wd-tag{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b8933a;border:1px solid rgba(180,140,60,0.28);padding:2px 8px;display:inline-block;margin-bottom:7px;border-radius:1px}
.wd-name{font-size:24px;font-weight:700;color:#f0e6cc;margin-bottom:7px;line-height:1.2}
.wd-desc{font-size:13px;color:rgba(200,180,150,0.62);line-height:1.9;font-weight:300}
.wd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:18px;border-top:1px solid rgba(180,140,60,0.09);padding-top:18px}
.wd-stat{background:rgba(180,140,60,0.04);padding:11px 13px;border-left:2px solid #b8933a;animation:fadeUp 0.4s ease both}
.wd-stat:nth-child(1){animation-delay:0.05s}
.wd-stat:nth-child(2){animation-delay:0.12s}
.wd-stat:nth-child(3){animation-delay:0.19s}
.wd-val{font-size:20px;font-weight:700;color:#b8933a;font-family:Georgia,serif}
.wd-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(200,180,150,0.38);margin-top:2px}
.wd-extra{margin-top:16px;font-size:12px;color:rgba(200,180,150,0.44);line-height:1.85;font-style:italic;border-left:2px solid rgba(180,140,60,0.17);padding-left:13px;animation:fadeIn 0.6s ease 0.3s both}

.vis-area{background:#090704;border:1px solid rgba(180,140,60,0.08);height:120px;margin:18px 0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vis-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(180,140,60,0.3);position:absolute;top:8px;left:12px}

.tl-wrap{position:relative;padding-left:44px}
.tl-wrap::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(180,140,60,0.28) 8%,rgba(180,140,60,0.28) 92%,transparent);animation:blinkLine 3s ease infinite}
.tl-row{position:relative;margin-bottom:14px;cursor:pointer}
.tl-dot{position:absolute;left:-38px;top:16px;width:11px;height:11px;border-radius:50%;background:#1a1408;border:2px solid rgba(180,140,60,0.22);transition:all 0.3s;animation:fadeIn 0.4s ease both}
.tl-dot.active{background:#b8933a;border-color:#b8933a;animation:dotPulse 1.5s ease infinite}
.tl-card{background:#0f0d08;border:1px solid rgba(180,140,60,0.09);padding:16px 18px;transition:border-color 0.25s,background 0.25s}
.tl-row:hover .tl-card{border-color:rgba(180,140,60,0.28)}
.tl-row.active .tl-card{border-color:rgba(180,140,60,0.38);background:#13100a}
.tl-yr{font-size:10px;letter-spacing:3px;color:#b8933a;margin-bottom:3px}
.tl-title{font-size:16px;color:#f0e6cc;font-weight:700;margin-bottom:0}
.tl-text{font-size:13px;color:rgba(200,180,150,0.58);line-height:1.85;display:none;overflow:hidden}
.tl-row.active .tl-text{display:block;animation:fadeUp 0.35s ease}
.tl-hint{font-size:9px;color:rgba(180,140,60,0.38);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.tl-row.active .tl-hint{display:none}

.cmp-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.cmp-tab{background:#0f0d08;border:1px solid rgba(180,140,60,0.1);padding:9px 14px;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:rgba(200,180,150,0.55);font-family:Georgia,serif;transition:all 0.2s;border-radius:2px}
.cmp-tab:hover{border-color:rgba(180,140,60,0.32);color:#e8dcc8}
.cmp-tab.active{border-color:#b8933a;background:rgba(180,140,60,0.09);color:#f0e6cc}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;animation:fadeUp 0.4s ease both}
.bar-lbl{width:110px;font-size:12px;color:rgba(200,180,150,0.65);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:20px;background:rgba(180,140,60,0.05);border:1px solid rgba(180,140,60,0.08);overflow:hidden;position:relative}
.bar-fill{height:100%;background:linear-gradient(90deg,rgba(180,140,60,0.35),rgba(184,147,58,0.65));display:flex;align-items:center;padding-left:7px;animation:barGrow 0.9s cubic-bezier(.4,0,.2,1) both}
.bar-fill:nth-child(1){animation-delay:0s}
.bar-num{font-size:11px;color:#c8a050;white-space:nowrap;font-family:Georgia,serif}
.cmp-note{font-size:11px;color:rgba(200,180,150,0.32);margin-top:16px;font-style:italic;text-align:center}

.w-btn-illus{width:100%;height:68px;display:block;background:#080602;border-bottom:1px solid rgba(180,140,60,0.15);overflow:hidden}.w-btn-illus svg{width:100%;height:100%}
.w-btn-bottom{display:flex;align-items:center;gap:6px;padding:7px 6px 9px}
.wd-photo-wrap{flex-shrink:0;width:170px;position:relative}
.wd-illus-large{width:170px;height:118px;display:block;background:#080602;border:1px solid rgba(180,140,60,0.25)}.wd-illus-large svg{width:100%;height:100%}
.wd-photo-cap{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(180,140,60,0.38);text-align:center;margin-top:4px;font-style:italic}
.wd-photo-frame{position:relative;display:inline-block}
.wd-photo-frame::after{content:'';position:absolute;inset:5px;border:1px solid rgba(180,140,60,0.14);pointer-events:none}
.q-prog{display:flex;gap:5px;margin-bottom:20px}
.q-pip{height:3px;flex:1;background:rgba(180,140,60,0.13);border-radius:2px;transition:background 0.4s}
.q-pip.done{background:#b8933a}
.q-pip.cur{background:rgba(180,140,60,0.45)}
.q-text{font-size:16px;color:#f0e6cc;margin-bottom:18px;line-height:1.65;font-weight:700;animation:quizPop 0.4s ease}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
@media(max-width:460px){.q-grid{grid-template-columns:1fr}}
.q-opt{background:#0f0d08;border:1px solid rgba(180,140,60,0.13);padding:13px 15px;cursor:pointer;text-align:left;color:rgba(200,180,150,0.78);font-size:13px;transition:border-color 0.2s,background 0.2s,transform 0.15s;font-family:Georgia,serif;line-height:1.5;animation:fadeUp 0.35s ease both}
.q-opt:nth-child(1){animation-delay:0.05s}
.q-opt:nth-child(2){animation-delay:0.1s}
.q-opt:nth-child(3){animation-delay:0.15s}
.q-opt:nth-child(4){animation-delay:0.2s}
.q-opt:hover:not(.locked){border-color:rgba(180,140,60,0.38);background:#14110a;transform:translateY(-2px)}
.q-opt.correct{border-color:#4a7c3f;background:rgba(74,124,63,0.1);color:#a8d898;animation:correctFlash 0.6s ease}
.q-opt.wrong{border-color:#7c3f3f;background:rgba(124,63,63,0.08);color:#d898a8;animation:wrongShake 0.4s ease}
.q-opt.locked{cursor:default;pointer-events:none}
.q-fb{font-size:13px;margin-top:7px;min-height:38px;color:rgba(200,180,150,0.55);line-height:1.7;font-style:italic;animation:fadeIn 0.4s ease}
.q-next{margin-top:14px;padding:9px 20px;background:transparent;border:1px solid rgba(180,140,60,0.28);color:#b8933a;cursor:pointer;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;transition:all 0.2s;display:none}
.q-next.show{display:inline-block;animation:fadeUp 0.3s ease}
.q-next:hover{background:rgba(180,140,60,0.09);border-color:#b8933a}
.score-box{text-align:center;padding:36px 24px;background:#0f0d08;border:1px solid rgba(180,140,60,0.18);animation:quizPop 0.5s ease}
.score-num{font-size:72px;font-weight:900;color:#b8933a;font-family:Georgia,serif;line-height:1;animation:countUp 0.6s ease 0.2s both}
.score-lbl{font-size:11px;letter-spacing:3px;color:rgba(200,180,150,0.4);text-transform:uppercase;margin-top:6px}
.score-msg{font-size:14px;color:rgba(200,180,150,0.65);margin-top:14px;line-height:1.7;animation:fadeUp 0.5s ease 0.4s both}
.score-stars{font-size:28px;margin:12px 0;animation:fadeUp 0.5s ease 0.5s both}
.restart{margin-top:18px;padding:10px 24px;background:transparent;border:1px solid rgba(180,140,60,0.35);color:#b8933a;cursor:pointer;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-family:Georgia,serif;transition:all 0.2s;animation:fadeUp 0.5s ease 0.6s both}
.restart:hover{background:rgba(180,140,60,0.09)}
</style>

</div>

</div></div>

function initSmoke(){
  const bg=document.getElementById('heroBg');
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    d.className='smoke-particle';
    const s=60+Math.random()*120;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*60}%;animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*12}s;`;
    bg.appendChild(d);
  }
}

function ripple(el,e){
  const r=document.createElement('div');r.className='w-btn-ripple';
  const rect=el.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height)*2;
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;`;
  el.appendChild(r);setTimeout(()=>r.remove(),500);
}

function switchTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  btn.classList.add('active');
}

  buildVisual(w.vis,document.getElementById('visArea'));
}

function selW(i,el){
  aW=i;
  ripple(el,event);
  setTimeout(renderW,50);
}

function renderTL(){
  document.getElementById('tlWrap').innerHTML=TL.map((t,i)=>`
    <div class="tl-row" id="tr${i}" onclick="togTL(${i})" style="animation:fadeUp 0.4s ease ${i*0.07}s both">
      <div class="tl-dot" id="td${i}"></div>
      <div class="tl-card">
        <div class="tl-yr">${t.yr}</div>
        <div class="tl-title">${t.title}</div>
        <div class="tl-text">${t.text}</div>
        <div class="tl-hint">Kattints ▾</div>
      </div>
    </div>`).join('');
}

function togTL(i){
  const was=document.getElementById('tr'+i).classList.contains('active');
  document.querySelectorAll('.tl-row').forEach(r=>r.classList.remove('active'));
  document.querySelectorAll('.tl-dot').forEach(d=>d.classList.remove('active'));
  if(!was){document.getElementById('tr'+i).classList.add('active');document.getElementById('td'+i).classList.add('active');}
}

function renderCMP(){
  document.getElementById('cmpTabs').innerHTML=Object.entries(CMP).map(([k,v])=>`
    <button class="cmp-tab${k===aCmp?' active':''}" onclick="selCmp('${k}')">${v.icon} ${v.name}</button>`).join('');
  const d=CMP[aCmp];
  document.getElementById('cmpChart').innerHTML=`<div>${d.items.map((it,i)=>`
    <div class="bar-row" style="animation-delay:${i*0.08}s">
      <div class="bar-lbl">${it.l}</div>
      <div class="bar-track">
        <div class="bar-fill" style="--target:${it.v}%;width:${it.v}%">
          <span class="bar-num">${it.v}/100</span>
        </div>
      </div>
    </div>`).join('')}
    <div class="cmp-note">Relatív pontszámok — szemléltetés céljából</div>
  </div>`;
}

function selCmp(k){aCmp=k;renderCMP();}

function renderQ(){
  const el=document.getElementById('quizEl');
  if(qDone){
    const pct=Math.round(qScore/QZ.length*100);
    const stars=pct>=80?'⭐⭐⭐':pct>=50?'⭐⭐':'⭐';
    const msg=pct>=80?'Kiváló! Valódi hadtörténész vagy!':pct>=50?'Nem rossz — még van mit tanulni!':'Érdemes újra átnézni a fegyvereket!';
    el.innerHTML=`<div class="score-box">
      <div class="score-num">${qScore}/${QZ.length}</div>
      <div class="score-lbl">Helyes válasz</div>
      <div class="score-stars">${stars}</div>
      <div class="score-msg">${msg}<br><br>${pct}% — ${pct>=80?'Kitüntetésre javasolt!':pct>=50?'Közepes felkészültség.':'Próbáld újra!'}</div>
      <button class="restart" onclick="restartQ()">↺ Újra próbálom</button>
    </div>`;return;
  }
  const q=QZ[qI];
  el.innerHTML=`
    <div class="q-prog">${QZ.map((_,i)=>`<div class="q-pip${i<qI?' done':i===qI?' cur':''}"></div>`).join('')}</div>
    <div class="q-text">${qI+1}. ${q.q}</div>
    <div class="q-grid">${q.opts.map((o,i)=>`<button class="q-opt" onclick="ansQ(${i})">${o}</button>`).join('')}</div>
    <div class="q-fb" id="qFb"></div>
    <button class="q-next" id="qNext" onclick="nextQ()">${qI===QZ.length-1?'Eredmény ▶':'Következő ▶'}</button>`;
}

function ansQ(i){
  if(qAns)return;qAns=true;
  const q=QZ[qI];
  document.querySelectorAll('.q-opt').forEach((o,j)=>{
    o.classList.add('locked');
    if(j===q.c)o.classList.add('correct');
    else if(j===i)o.classList.add('wrong');
  });
  const fb=document.getElementById('qFb');
  if(i===q.c){qScore++;fb.style.color='#a8d898';fb.textContent='✓ Helyes! '+q.exp;}
  else{fb.style.color='#d89898';fb.textContent='✗ Sajnos nem. '+q.exp;}
  const nb=document.getElementById('qNext');nb.classList.add('show');
}

function nextQ(){qI++;qAns=false;if(qI>=QZ.length)qDone=true;renderQ();}
function restartQ(){qI=0;qScore=0;qAns=false;qDone=false;renderQ();}

initSmoke();renderW();renderTL();renderCMP();renderQ();
</script>
