<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Az első világháború fegyverei-Barta Csanád</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0b07;color:#e8dcc8;font-family:Georgia,serif;overflow-x:hidden}
.hero{text-align:center;padding:60px 24px 40px;background:radial-gradient(ellipse at center,#1a1208 0%,#0d0b07 70%);position:relative;overflow:hidden}
.hero-bg-year{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:220px;font-weight:900;color:rgba(180,140,60,0.04);pointer-events:none;white-space:nowrap;font-family:Georgia,serif}
.hero h1{font-size:clamp(28px,6vw,64px);font-weight:900;color:#f0e6cc;line-height:1.1;margin-bottom:12px;position:relative}
.hero p{color:rgba(200,180,150,0.6);font-size:15px;margin-bottom:32px;position:relative}
.eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#b8933a;margin-bottom:16px;position:relative}
.tabs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:0 16px 32px;position:relative;z-index:2}
.tab{padding:8px 20px;border:1px solid rgba(180,140,60,0.2);background:transparent;color:rgba(200,180,150,0.5);cursor:pointer;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;transition:all 0.25s;border-radius:2px}
.tab:hover{border-color:rgba(180,140,60,0.5);color:#e8dcc8}
.tab.active{background:rgba(180,140,60,0.12);border-color:#b8933a;color:#f0e6cc}
.panel{display:none;animation:fadeIn 0.4s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.section{max-width:960px;margin:0 auto;padding:24px 20px 48px}
.weapons-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
@media(max-width:520px){.weapons-nav{grid-template-columns:repeat(2,1fr)}}
.w-btn{background:#111008;border:1px solid rgba(180,140,60,0.12);padding:14px 10px;cursor:pointer;text-align:center;transition:all 0.2s;color:#e8dcc8;font-family:Georgia,serif}
.w-btn:hover{border-color:rgba(180,140,60,0.4);background:#17140c}
.w-btn.active{border-color:#b8933a;background:rgba(180,140,60,0.1)}
.w-btn-icon{font-size:28px;display:block;margin-bottom:6px;filter:saturate(0.5)}
.w-btn-name{font-size:11px;letter-spacing:1px;color:rgba(200,180,150,0.7)}
.weapon-detail{background:#111008;border:1px solid rgba(180,140,60,0.15);padding:28px 28px 24px;animation:fadeIn 0.3s ease}
.wd-top{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
.wd-icon{font-size:56px;filter:saturate(0.5);flex-shrink:0}
.wd-tag{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b8933a;border:1px solid rgba(180,140,60,0.3);padding:2px 8px;display:inline-block;margin-bottom:8px;border-radius:1px}
.wd-name{font-size:26px;font-weight:700;color:#f0e6cc;margin-bottom:8px;line-height:1.2}
.wd-desc{font-size:14px;color:rgba(200,180,150,0.65);line-height:1.85;font-weight:300}
.wd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:20px;border-top:1px solid rgba(180,140,60,0.1);padding-top:20px}
.wd-stat{background:rgba(180,140,60,0.05);padding:12px 14px;border-left:2px solid #b8933a}
.wd-stat-val{font-size:22px;font-weight:700;color:#b8933a;font-family:Georgia,serif}
.wd-stat-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(200,180,150,0.4);margin-top:2px}
.wd-extra{margin-top:18px;font-size:13px;color:rgba(200,180,150,0.5);line-height:1.8;font-style:italic;border-left:2px solid rgba(180,140,60,0.2);padding-left:14px}
.tl-wrap{position:relative;padding-left:48px}
.tl-wrap::before{content:'';position:absolute;left:16px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(180,140,60,0.3) 10%,rgba(180,140,60,0.3) 90%,transparent)}
.tl-item-wrap{position:relative}
.tl-dot{position:absolute;left:-40px;top:14px;width:12px;height:12px;border-radius:50%;background:#3a2f10;border:2px solid rgba(180,140,60,0.3);transition:all 0.3s}
.tl-dot.active{background:#b8933a;border-color:#b8933a;box-shadow:0 0 12px rgba(180,140,60,0.4)}
.tl-item{margin-bottom:16px;cursor:pointer}
.tl-card{background:#111008;border:1px solid rgba(180,140,60,0.1);padding:18px 20px;transition:border-color 0.2s}
.tl-item:hover .tl-card{border-color:rgba(180,140,60,0.3)}
.tl-item.active .tl-card{border-color:rgba(180,140,60,0.4);background:#14110a}
.tl-year{font-size:11px;letter-spacing:3px;color:#b8933a;margin-bottom:4px}
.tl-title{font-size:17px;color:#f0e6cc;margin-bottom:8px;font-weight:700}
.tl-text{font-size:13px;color:rgba(200,180,150,0.6);line-height:1.8;display:none}
.tl-item.active .tl-text{display:block}
.tl-expand{font-size:10px;color:rgba(180,140,60,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.tl-item.active .tl-expand{display:none}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:24px}
.cmp-cat{background:#111008;border:1px solid rgba(180,140,60,0.1);padding:16px 12px;cursor:pointer;text-align:center;transition:all 0.2s;color:#e8dcc8;font-family:Georgia,serif}
.cmp-cat:hover{border-color:rgba(180,140,60,0.35)}
.cmp-cat.active{border-color:#b8933a;background:rgba(180,140,60,0.08)}
.cmp-cat-icon{font-size:24px;margin-bottom:6px;display:block;filter:saturate(0.5)}
.cmp-cat-name{font-size:11px;letter-spacing:1px;color:rgba(200,180,150,0.7)}
.bar-chart{margin-top:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-label{width:130px;font-size:12px;color:rgba(200,180,150,0.7);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:22px;background:rgba(180,140,60,0.06);border:1px solid rgba(180,140,60,0.1);position:relative;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,rgba(180,140,60,0.4),rgba(180,140,60,0.7));transition:width 0.8s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding-left:8px}
.bar-val{font-size:11px;color:#b8933a;white-space:nowrap;font-family:Georgia,serif}
.compare-note{font-size:12px;color:rgba(200,180,150,0.4);margin-top:20px;font-style:italic;text-align:center}
.quiz-q{font-size:17px;color:#f0e6cc;margin-bottom:20px;line-height:1.6;font-family:Georgia,serif;font-weight:700}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
@media(max-width:480px){.quiz-opts{grid-template-columns:1fr}}
.quiz-opt{background:#111008;border:1px solid rgba(180,140,60,0.15);padding:14px 16px;cursor:pointer;text-align:left;color:rgba(200,180,150,0.8);font-size:13px;transition:all 0.2s;font-family:Georgia,serif;line-height:1.5}
.quiz-opt:hover:not(.disabled){border-color:rgba(180,140,60,0.4);background:#17140c;color:#f0e6cc}
.quiz-opt.correct{border-color:#4a7c3f;background:rgba(74,124,63,0.1);color:#a8d898}
.quiz-opt.wrong{border-color:#7c3f3f;background:rgba(124,63,63,0.1);color:#d89898}
.quiz-opt.disabled{cursor:default;pointer-events:none}
.quiz-feedback{font-size:14px;margin-top:8px;min-height:40px;color:rgba(200,180,150,0.6);line-height:1.6;font-style:italic}
.quiz-progress{display:flex;gap:6px;margin-bottom:24px}
.quiz-pip{width:28px;height:4px;background:rgba(180,140,60,0.15);border-radius:2px;transition:background 0.3s}
.quiz-pip.done{background:#b8933a}
.quiz-pip.current{background:rgba(180,140,60,0.5)}
.quiz-score-box{text-align:center;padding:32px;background:#111008;border:1px solid rgba(180,140,60,0.2)}
.quiz-score-num{font-size:64px;font-weight:900;color:#b8933a;font-family:Georgia,serif;line-height:1}
.quiz-score-lbl{font-size:12px;letter-spacing:3px;color:rgba(200,180,150,0.5);text-transform:uppercase;margin-top:8px}
.quiz-score-msg{font-size:15px;color:rgba(200,180,150,0.7);margin-top:16px;line-height:1.6}
.quiz-restart{margin-top:20px;padding:10px 24px;background:transparent;border:1px solid rgba(180,140,60,0.4);color:#b8933a;cursor:pointer;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-family:Georgia,serif;transition:all 0.2s}
.quiz-restart:hover{background:rgba(180,140,60,0.1)}
.next-btn{margin-top:16px;padding:9px 20px;background:transparent;border:1px solid rgba(180,140,60,0.3);color:#b8933a;cursor:pointer;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;transition:all 0.2s;display:none}
.next-btn.show{display:inline-block}
.next-btn:hover{background:rgba(180,140,60,0.1);border-color:#b8933a}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-bg-year">1914</div>
  <p class="eyebrow">Hadtörténet · 1914–1918</p>
  <h1>Az első világháború fegyverei</h1>
  <p>Kattints, fedezz fel, tesztelj!</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('fegyverek',this)">⚔️ Fegyverek</button>
  <button class="tab" onclick="switchTab('idovonal',this)">📅 Idővonal</button>
  <button class="tab" onclick="switchTab('osszehasonlitas',this)">📊 Összehasonlítás</button>
  <button class="tab" onclick="switchTab('kviz',this)">❓ Kvíz</button>
</div>

<div id="panel-fegyverek" class="panel active">
  <div class="section">
    <div class="weapons-nav" id="weaponNav"></div>
    <div class="weapon-detail" id="weaponDetail"></div>
  </div>
</div>

<div id="panel-idovonal" class="panel">
  <div class="section">
    <div class="tl-wrap" id="timeline"></div>
  </div>
</div>

<div id="panel-osszehasonlitas" class="panel">
  <div class="section">
    <div class="compare-grid" id="compareNav"></div>
    <div id="compareChart"></div>
  </div>
</div>

<div id="panel-kviz" class="panel">
  <div class="section" id="quizSection"></div>
</div>

<script>
const weapons = [
  {icon:'💣',tag:'Tüzérség',name:'Tüzérségi ágyú',desc:'A háború legtöbb halálos áldozatát a tüzérség okozta. A nehézágyúk akár 40 km-es hatótávolsággal rendelkeztek, és tonnányi fémet zúdítottak az ellenséges állásokra nap mint nap.',stats:[{v:'40 km',l:'Hatótáv'},{v:'~60%',l:'Összes halálozás'},{v:'750 kg',l:'Lövedék súlya'}],extra:'A „Big Bertha" nevű német nehézágyú 940 kg-os lövedékeket lőhetett ki, és Párizst is elérte.'},
  
  {icon:'⚗️',tag:'Vegyifegyver',name:'Mérges gáz',desc:'1915-től klórgáz, foszgén és mustárgáz terrorba taszította a lövészárkokat. A mustárgáz bőrön, tüdőn és szemeken át egyaránt hatott — az első igazi tömegpusztító fegyver.',stats:[{v:'1915',l:'Első bevetés'},{v:'3 típus',l:'Főbb gázok'},{v:'91 000',l:'Halálos áldozat'}],extra:'Az Ipernél bevetett klórgáz 6000 katona halálát okozta egyetlen nap alatt.'},
  {icon:'🚗',tag:'Páncélos jármű',name:'Harckocsi (Tank)',desc:'1916-ban a britek vetették be először a Somme-nál. A lövészárkok és a szögesdrót áttörésére tervezték. Korai modelljei megbízhatatlanok voltak, de megváltoztatták a hadviselést örökre.',stats:[{v:'1916',l:'Első bevetés'},{v:'8 km/h',l:'Sebesség'},{v:'28 tonna',l:'Súly (Mk I)'}],extra:'Az első bevetésnél 49 tankból csak 18 érte el a frontvonalat — a többi meghibásodott vagy elakadt a sárban.'},
  {icon:'✈️',tag:'Légi hadviselés',name:'Katonai repülő',desc:'A repülők eleinte csak felderítésre szolgáltak. A háború végére vadászgépek és bombázók uralták az eget. A „légi ászok" — mint Manfred von Richthofen — 80+ győzelmet arattak.',stats:[{v:'180 km/h',l:'Max sebesség'},{v:'80+',l:'Richthofen győzelmei'},{v:'~8 000',l:'Bevetett gép (1918)'}],extra:'Manfred von Richthofen, a „Vörös Báró" 80 légi győzelmet szerzett — a történelem legsikeresebbje.'},
  {icon:'🔫',tag:'Gyalogsági fegyver',name:'Géppuska',desc:'A Maxim-géppuska percenként 600 lövést adhatott le. Egyetlen fegyverállás megállíthatta az egész rohamot — ez kényszerítette a katonákat a lövészárokba.',stats:[{v:'600/perc',l:'Tűzgyorsaság'},{v:'2 km',l:'Hatótáv'},{v:'4 fős',l:'Kezelő legénység'}],extra:'A Somme-i csata első napján (1916. július 1.) a britek 57 470 embert veszítettek — főleg géppuskatűzben.'},
  {icon:'🚢',tag:'Tengeri hadviselés',name:'Tengeralattjáró (U-Boot)',desc:'A német U-Bootok blokádot hoztak létre az Atlanti-óceánon. A Lusitania elsüllyesztése (1 198 áldozat) az USA közvéleményét a háború felé fordította.',stats:[{v:'~350',l:'Elsüllyesztett hajó'},{v:'30 m',l:'Merülési mélység'},{v:'373',l:'Bevetett U-Boot'}],extra:'A Lusitania elsüllyesztése (1915) 1 198 ember halálát okozta, és az USA végül 1917-ben belépett a háborúba.'}
];

const tlData = [
  {year:'1914 júl.',title:'A háború kitör',text:'Szarajevóban meggyilkolják Ferenc Ferdinándot. Az szövetségi rendszer dominóként dönti le az országokat — néhány hét alatt Európa lángba borul. A régi fegyverek — lovasság, szurony — hamar elavulnak.'},
  {year:'1914 szept.',title:'Lövészárokháború kezdete',text:'A Marne-i csata után mindkét fél sáncokba húzódik. A frontvonal hossza eléri a 700 km-t. Az állóháború évekig tart — a katonák embertelen körülmények között élnek a sárban.'},
  {year:'1915 ápr.',title:'Első gáztámadás',text:'Ipernél a németek klórgázt vetnek be — ez az első tömeges vegyifegyver-bevetés. A sárga-zöld felhő halálos meglepetésként éri a szövetségeseket. Rövidesen megjelenik a gázálarc.'},
  {year:'1915 máj.',title:'Lusitania elsüllyed',text:'Egy német U-Boot torpedóval elsüllyeszti a brit Lusitania óceánjárót. 1 198 utas hal meg, köztük 128 amerikai. Az eset az USA közvéleményét a háború felé fordítja.'},
  {year:'1916 szept.',title:'Első tanktámadás',text:'A Somme-i csatában a britek bevetik az első tankokat. A Mark I harckocsi pánikba ejti a németeket — de megbízhatatlan, és a terep sem kedvez neki. A tanktaktika még fejlődik.'},
  {year:'1917 ápr.',title:'USA belép a háborúba',text:'Németország meghirdeti a korlátlan tengeralattjáró-háborút, és titkos szövetséget ajánl Mexikónak az USA ellen (Zimmermann-távirat). Az USA hadat üzen Németországnak.'},
  {year:'1918 nov.',title:'Fegyverszünet',text:'November 11-én 11 órakor elhallgatnak a fegyverek. Négy éven át tartó ipari méretű háború ér véget. 17 millió ember halt meg. A világ és a hadviselés örökre megváltozott.'}
];

const compareData = {
  pusztitas:{name:'Pusztítás mértéke',icon:'💥',items:[
    {label:'Tüzérség',val:95},{label:'Mérges gáz',val:45},{label:'Géppuska',val:80},{label:'Tank',val:55},{label:'Repülő',val:35},{label:'U-Boot',val:60}
  ]},
  ujitas:{name:'Technológiai újítás',icon:'⚙️',items:[
    {label:'Tüzérség',val:40},{label:'Mérges gáz',val:95},{label:'Géppuska',val:70},{label:'Tank',val:90},{label:'Repülő',val:85},{label:'U-Boot',val:80}
  ]},
  felelem:{name:'Lélektani hatás',icon:'😨',items:[
    {label:'Tüzérség',val:80},{label:'Mérges gáz',val:99},{label:'Géppuska',val:75},{label:'Tank',val:90},{label:'Repülő',val:60},{label:'U-Boot',val:70}
  ]},
  strategia:{name:'Stratégiai hatás',icon:'🗺️',items:[
    {label:'Tüzérség',val:85},{label:'Mérges gáz',val:50},{label:'Géppuska',val:90},{label:'Tank',val:75},{label:'Repülő',val:65},{label:'U-Boot',val:80}
  ]}
};

const quizData = [
  {q:'Melyik csatában vetették be először a tankokat?',opts:['Verdun-i csata','Somme-i csata','Marne-i csata','Gallipolii csata'],correct:1,exp:'Az első tankokat 1916. szeptember 15-én vetette be a brit hadsereg a Somme-i csatában.'},
  {q:'Melyik gázt vetették be elsőnek tömeges méretekben az első világháborúban?',opts:['Mustárgáz','Foszgén','Klórgáz','Ciklon-B'],correct:2,exp:'1915 áprilisában Ipernél a németek klórgázt vetettek be — ez volt az első tömeges gáztámadás.'},
  {q:'Hány győzelmet szerzett Manfred von Richthofen, a „Vörös Báró"?',opts:['40','60','80','100'],correct:2,exp:'Manfred von Richthofen 80 légi győzelmet szerzett — ő a történelem legeredményesebb vadászpilótája.'},
  {q:'Melyik hajó elsüllyesztése segítette elő az USA háborúba lépését?',opts:['Titanic','Lusitania','Bismarck','Olympic'],correct:1,exp:'A Lusitania 1915-ös elsüllyesztése 1 198 áldozatot követelt, köztük 128 amerikait.'},
  {q:'A Maxim-géppuska hány lövést adhatott le percenként?',opts:['100','300','600','1200'],correct:2,exp:'A Maxim-géppuska percenként kb. 600 lövést adhatott le.'},
  {q:'Melyik ország fejlesztette ki az első tankokat?',opts:['Franciaország','Németország','Nagy-Britannia','Oroszország'],correct:2,exp:'A britek fejlesztették ki az első harckocsikat, amelyeket Mark I névvel vetettek be 1916-ban.'}
];

let activeWeapon=0, activeCmp='pusztitas', quizIdx=0, quizScore=0, quizAnswered=false, quizDone=false;

function switchTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

function renderWeapons(){
  document.getElementById('weaponNav').innerHTML=weapons.map((w,i)=>`
    <div class="w-btn${i===activeWeapon?' active':''}" onclick="selectWeapon(${i})">
      <span class="w-btn-icon">${w.icon}</span>
      <span class="w-btn-name">${w.name}</span>
    </div>`).join('');
  const w=weapons[activeWeapon];
  document.getElementById('weaponDetail').innerHTML=`
    <div class="wd-top">
      <span class="wd-icon">${w.icon}</span>
      <div>
        <span class="wd-tag">${w.tag}</span>
        <div class="wd-name">${w.name}</div>
        <div class="wd-desc">${w.desc}</div>
      </div>
    </div>
    <div class="wd-stats">${w.stats.map(s=>`<div class="wd-stat"><div class="wd-stat-val">${s.v}</div><div class="wd-stat-lbl">${s.l}</div></div>`).join('')}</div>
    <div class="wd-extra">${w.extra}</div>`;
}

function selectWeapon(i){activeWeapon=i;renderWeapons();}

function renderTimeline(){
  document.getElementById('timeline').innerHTML=tlData.map((t,i)=>`
    <div class="tl-item-wrap">
      <div class="tl-dot" id="dot${i}"></div>
      <div class="tl-item" id="tli${i}" onclick="toggleTl(${i})">
        <div class="tl-card">
          <div class="tl-year">${t.year}</div>
          <div class="tl-title">${t.title}</div>
          <div class="tl-text">${t.text}</div>
          <div class="tl-expand">Kattints a részletekért ▾</div>
        </div>
      </div>
    </div>`).join('');
}

function toggleTl(i){
  const item=document.getElementById('tli'+i);
  const dot=document.getElementById('dot'+i);
  const wasActive=item.classList.contains('active');
  document.querySelectorAll('.tl-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tl-dot').forEach(el=>el.classList.remove('active'));
  if(!wasActive){item.classList.add('active');dot.classList.add('active');}
}

function renderCompare(){
  document.getElementById('compareNav').innerHTML=Object.entries(compareData).map(([k,v])=>`
    <div class="cmp-cat${k===activeCmp?' active':''}" onclick="selectCmp('${k}')">
      <span class="cmp-cat-icon">${v.icon}</span>
      <span class="cmp-cat-name">${v.name}</span>
    </div>`).join('');
  const d=compareData[activeCmp];
  document.getElementById('compareChart').innerHTML=`
    <div class="bar-chart">${d.items.map(it=>`
      <div class="bar-row">
        <div class="bar-label">${it.label}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${it.val}%">
            <span class="bar-val">${it.val}/100</span>
          </div>
        </div>
      </div>`).join('')}
    </div>
    <div class="compare-note">Relatív pontszámok — szemléltetés céljából</div>`;
}

function selectCmp(k){activeCmp=k;renderCompare();}

function renderQuiz(){
  const sec=document.getElementById('quizSection');
  if(quizDone){
    const pct=Math.round(quizScore/quizData.length*100);
    const msg=pct>=80?'Kiváló! Valódi hadtörténész vagy!':pct>=50?'Nem rossz — még van mit tanulni!':'Érdemes újra átnézni a fegyvereket!';
    sec.innerHTML=`<div class="quiz-score-box">
      <div class="quiz-score-num">${quizScore}/${quizData.length}</div>
      <div class="quiz-score-lbl">Helyes válasz</div>
      <div class="quiz-score-msg">${msg}<br><br>${pct}% — ${pct>=80?'Kitüntetésre javasolt!':pct>=50?'Közepes felkészültség.':'Próbáld újra!'}</div>
      <button class="quiz-restart" onclick="restartQuiz()">Újra próbálom</button>
    </div>`;
    return;
  }
  const q=quizData[quizIdx];
  sec.innerHTML=`
    <div class="quiz-progress">${quizData.map((_,i)=>`<div class="quiz-pip${i<quizIdx?' done':i===quizIdx?' current':''}"></div>`).join('')}</div>
    <div class="quiz-q">${quizIdx+1}. ${q.q}</div>
    <div class="quiz-opts" id="quizOpts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>
    <div class="quiz-feedback" id="quizFb"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">${quizIdx===quizData.length-1?'Eredmény':'Következő ▶'}</button>`;
}

function answerQuiz(i){
  if(quizAnswered)return;
  quizAnswered=true;
  const q=quizData[quizIdx];
  document.querySelectorAll('.quiz-opt').forEach((o,j)=>{
    o.classList.add('disabled');
    if(j===q.correct)o.classList.add('correct');
    else if(j===i)o.classList.add('wrong');
  });
  const fb=document.getElementById('quizFb');
  if(i===q.correct){quizScore++;fb.style.color='#a8d898';fb.textContent='✓ Helyes! '+q.exp;}
  else{fb.style.color='#d89898';fb.textContent='✗ Sajnos nem. '+q.exp;}
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){quizIdx++;quizAnswered=false;if(quizIdx>=quizData.length)quizDone=true;renderQuiz();}
function restartQuiz(){quizIdx=0;quizScore=0;quizAnswered=false;quizDone=false;renderQuiz();}

renderWeapons();
renderTimeline();
renderCompare();
renderQuiz();
</script>
</body>
</html>
