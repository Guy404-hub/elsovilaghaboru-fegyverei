    const s=60+Math.random()*120;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*60}%;animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*12}s;`;
    bg.appendChild(d);
  }
}

function ripple(el,e){
  const r=document.createElement('div');r.className='w-btn-ripple';
  const rect=el.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height)*2;
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;`;
  el.appendChild(r);setTimeout(()=>r.remove(),500);
}

function switchTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  btn.classList.add('active');
}

function buildVisual(type,container){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  svg.style.position='absolute';svg.style.inset='0';
  if(type==='cannon'){
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const shell=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    shell.setAttribute('cx','50%');shell.setAttribute('cy','50%');
    shell.setAttribute('rx','8');shell.setAttribute('ry','5');
    shell.setAttribute('fill','#b8933a');
    shell.style.animation='shellFly 2s ease infinite';
    const trail=document.createElementNS('http://www.w3.org/2000/svg','line');
    trail.setAttribute('x1','0');trail.setAttribute('y1','60');trail.setAttribute('x2','100%');trail.setAttribute('y2','60');
    trail.setAttribute('stroke','rgba(180,140,60,0.12)');trail.setAttribute('stroke-width','1');
    trail.setAttribute('stroke-dasharray','6 4');
    svg.appendChild(trail);svg.appendChild(shell);
  } else if(type==='gas'){
    for(let i=0;i<6;i++){
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',`${15+i*14}%`);c.setAttribute('cy','70%');
      c.setAttribute('r',`${12+Math.random()*10}`);
      c.setAttribute('fill',`rgba(${80+i*10},${140+i*8},${60},0.18)`);
      c.style.animation=`smokePuff ${2+i*0.4}s ease infinite`;
      c.style.animationDelay=`${i*0.3}s`;
      svg.appendChild(c);
    }
  } else if(type==='tank'){
    const body=document.createElementNS('http://www.w3.org/2000/svg','rect');
    body.setAttribute('x','30%');body.setAttribute('y','45%');
    body.setAttribute('width','40%');body.setAttribute('height','30%');
    body.setAttribute('fill','rgba(180,140,60,0.15)');body.setAttribute('stroke','rgba(180,140,60,0.3)');body.setAttribute('stroke-width','1');body.setAttribute('rx','3');
    const turret=document.createElementNS('http://www.w3.org/2000/svg','rect');
    turret.setAttribute('x','42%');turret.setAttribute('y','33%');
    turret.setAttribute('width','16%');turret.setAttribute('height','15%');
    turret.setAttribute('fill','rgba(180,140,60,0.2)');turret.setAttribute('rx','2');
    const barrel=document.createElementNS('http://www.w3.org/2000/svg','line');
    barrel.setAttribute('x1','58%');barrel.setAttribute('y1','40%');barrel.setAttribute('x2','72%');barrel.setAttribute('y2','40%');
    barrel.setAttribute('stroke','rgba(180,140,60,0.5)');barrel.setAttribute('stroke-width','2');
    svg.appendChild(body);svg.appendChild(turret);svg.appendChild(barrel);
    svg.style.animation='fadeIn 0.5s ease';
  } else if(type==='plane'){
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M 120 60 L 160 55 L 200 60 L 180 65 L 180 72 L 160 70 L 140 72 L 140 65 Z');
    path.setAttribute('fill','rgba(180,140,60,0.15)');path.setAttribute('stroke','rgba(180,140,60,0.35)');path.setAttribute('stroke-width','1');
    path.style.animation='shellFly 3s ease-in-out infinite';
    svg.appendChild(path);
  } else if(type==='gun'){
    for(let i=0;i<8;i++){
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',`${10+i*12}%`);dot.setAttribute('cy','50%');dot.setAttribute('r','3');
      dot.setAttribute('fill','#b8933a');dot.style.opacity='0';
      dot.style.animation=`fadeIn 0.1s ease ${i*0.08}s both, smokeRise 1s ease ${i*0.08}s infinite`;
      svg.appendChild(dot);
    }
  } else if(type==='sub'){
    const hull=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    hull.setAttribute('cx','50%');hull.setAttribute('cy','65%');hull.setAttribute('rx','25%');hull.setAttribute('ry','12%');
    hull.setAttribute('fill','rgba(180,140,60,0.12)');hull.setAttribute('stroke','rgba(180,140,60,0.28)');hull.setAttribute('stroke-width','1');
    const wave=document.createElementNS('http://www.w3.org/2000/svg','path');
    wave.setAttribute('d','M 20 52 Q 60 45 100 52 Q 140 59 180 52 Q 220 45 260 52');
    wave.setAttribute('fill','none');wave.setAttribute('stroke','rgba(100,150,200,0.25)');wave.setAttribute('stroke-width','2');
    svg.appendChild(wave);svg.appendChild(hull);
  }
  container.appendChild(svg);
}

function renderW(){
  document.getElementById('wNav').innerHTML=W.map((w,i)=>`
    <div class="w-btn${i===aW?' active':''}" onclick="selW(${i},this)" style="animation:fadeUp 0.4s ease ${i*0.05}s both">
      <span class="w-icon">${w.icon}</span>
      <span class="w-name">${w.name}</span>
    </div>`).join('');
  const w=W[aW];
  document.getElementById('wDetail').innerHTML=`
    <div class="wd">
      <div class="wd-top">
        <span class="wd-ico">${w.icon}</span>
        <div>
          <span class="wd-tag">${w.tag}</span>
          <div class="wd-name">${w.name}</div>
          <div class="wd-desc">${w.desc}</div>
        </div>
      </div>
      <div class="vis-area" id="visArea"><span class="vis-label">Animáció</span></div>
      <div class="wd-stats">${w.stats.map(s=>`<div class="wd-stat"><div class="wd-val">${s.v}</div><div class="wd-lbl">${s.l}</div></div>`).join('')}</div>
      <div class="wd-extra">${w.extra}</div>
    </div>`;
  buildVisual(w.vis,document.getElementById('visArea'));
}

function selW(i,el){
  aW=i;
  ripple(el,event);
  setTimeout(renderW,50);
}

function renderTL(){
  document.getElementById('tlWrap').innerHTML=TL.map((t,i)=>`
    <div class="tl-row" id="tr${i}" onclick="togTL(${i})" style="animation:fadeUp 0.4s ease ${i*0.07}s both">
      <div class="tl-dot" id="td${i}"></div>
      <div class="tl-card">
        <div class="tl-yr">${t.yr}</div>
        <div class="tl-title">${t.title}</div>
        <div class="tl-text">${t.text}</div>
        <div class="tl-hint">Kattints ▾</div>
      </div>
    </div>`).join('');
}

function togTL(i){
  const was=document.getElementById('tr'+i).classList.contains('active');
  document.querySelectorAll('.tl-row').forEach(r=>r.classList.remove('active'));
  document.querySelectorAll('.tl-dot').forEach(d=>d.classList.remove('active'));
  if(!was){document.getElementById('tr'+i).classList.add('active');document.getElementById('td'+i).classList.add('active');}
}

function renderCMP(){
  document.getElementById('cmpTabs').innerHTML=Object.entries(CMP).map(([k,v])=>`
    <button class="cmp-tab${k===aCmp?' active':''}" onclick="selCmp('${k}')">${v.icon} ${v.name}</button>`).join('');
  const d=CMP[aCmp];
  document.getElementById('cmpChart').innerHTML=`<div>${d.items.map((it,i)=>`
    <div class="bar-row" style="animation-delay:${i*0.08}s">
      <div class="bar-lbl">${it.l}</div>
      <div class="bar-track">
        <div class="bar-fill" style="--target:${it.v}%;width:${it.v}%">
          <span class="bar-num">${it.v}/100</span>
        </div>
      </div>
    </div>`).join('')}
    <div class="cmp-note">Relatív pontszámok — szemléltetés céljából</div>
  </div>`;
}

function selCmp(k){aCmp=k;renderCMP();}

function renderQ(){
  const el=document.getElementById('quizEl');
  if(qDone){
    const pct=Math.round(qScore/QZ.length*100);
    const stars=pct>=80?'⭐⭐⭐':pct>=50?'⭐⭐':'⭐';
    const msg=pct>=80?'Kiváló! Valódi hadtörténész vagy!':pct>=50?'Nem rossz — még van mit tanulni!':'Érdemes újra átnézni a fegyvereket!';
    el.innerHTML=`<div class="score-box">
      <div class="score-num">${qScore}/${QZ.length}</div>
      <div class="score-lbl">Helyes válasz</div>
      <div class="score-stars">${stars}</div>
      <div class="score-msg">${msg}<br><br>${pct}% — ${pct>=80?'Kitüntetésre javasolt!':pct>=50?'Közepes felkészültség.':'Próbáld újra!'}</div>
      <button class="restart" onclick="restartQ()">↺ Újra próbálom</button>
    </div>`;return;
  }
  const q=QZ[qI];
  el.innerHTML=`
    <div class="q-prog">${QZ.map((_,i)=>`<div class="q-pip${i<qI?' done':i===qI?' cur':''}"></div>`).join('')}</div>
    <div class="q-text">${qI+1}. ${q.q}</div>
    <div class="q-grid">${q.opts.map((o,i)=>`<button class="q-opt" onclick="ansQ(${i})">${o}</button>`).join('')}</div>
    <div class="q-fb" id="qFb"></div>
    <button class="q-next" id="qNext" onclick="nextQ()">${qI===QZ.length-1?'Eredmény ▶':'Következő ▶'}</button>`;
}

function ansQ(i){
  if(qAns)return;qAns=true;
  const q=QZ[qI];
  document.querySelectorAll('.q-opt').forEach((o,j)=>{
    o.classList.add('locked');
    if(j===q.c)o.classList.add('correct');
    else if(j===i)o.classList.add('wrong');
  });
  const fb=document.getElementById('qFb');
  if(i===q.c){qScore++;fb.style.color='#a8d898';fb.textContent='✓ Helyes! '+q.exp;}
  else{fb.style.color='#d89898';fb.textContent='✗ Sajnos nem. '+q.exp;}
  const nb=document.getElementById('qNext');nb.classList.add('show');
}

function nextQ(){qI++;qAns=false;if(qI>=QZ.length)qDone=true;renderQ();}
function restartQ(){qI=0;qScore=0;qAns=false;qDone=false;renderQ();}

initSmoke();renderW();renderTL();renderCMP();renderQ();
</script>
